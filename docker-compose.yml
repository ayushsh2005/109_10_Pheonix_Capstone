name: portfolio-manager

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: portfolio_db
    volumes:
      - mysql_data:/var/lib/mysql
      # Real schema/data fixtures — loaded automatically by the MySQL
      # entrypoint ONLY on first init of an empty data volume.
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pm-net]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/CHANGE_ME/portfolio-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/portfolio_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Schema is owned by schema.sql above — Hibernate only verifies it.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    networks: [pm-net]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/CHANGE_ME/portfolio-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [pm-net]

  # Optional public tunnel for demos on a VM without a domain/open ports.
  # Start with: docker compose --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    command: ["http", "frontend:80", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    ports:
      - "4040:4040"   # ngrok's local inspection dashboard
    depends_on:
      - frontend
    networks: [pm-net]
    profiles: ["tunnel"]

volumes:
  mysql_data:

networks:
  pm-net:
    driver: bridge

name: portfolio-manager

services:

  mysql:
    image: mysql:8
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: portfolio_db

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - pm-net


  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/portfolio_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

    networks:
      - pm-net


  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${HTTP_PORT:-80}:80"

    networks:
      - pm-net


  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped

    command:
      [
        "http",
        "frontend:80",
        "--log=stdout"
      ]

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    ports:
      - "4040:4040"

    depends_on:
      - frontend

    networks:
      - pm-net

    profiles:
      - tunnel


volumes:
  mysql_data:


networks:
  pm-net:
    driver: bridge
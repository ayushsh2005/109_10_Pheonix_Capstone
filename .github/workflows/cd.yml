name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to deploy (defaults to commit SHA)"
        required: false
        type: string


concurrency:
  group: cd-production
  cancel-in-progress: false


env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio-frontend


jobs:

  build-and-push:
    name: Build and push Docker images

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}


      - name: Generate image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.image_tag }}"

          if [ -z "$TAG" ]; then
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Deploy tag: $TAG"



      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build and push backend image
        uses: docker/build-push-action@v6

        with:
          context: ./backend
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.BACKEND_IMAGE }}:latest

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend



      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          push: true

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend



  deploy:

    name: Deploy to production VM

    needs:
      - build-and-push

    runs-on: ubuntu-latest


    environment:
      name: production


    steps:


      - name: Deploy through SSH

        uses: appleboy/ssh-action@v1.2.0


        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}


        with:

          host: ${{ secrets.VM_HOST }}

          username: ${{ secrets.VM_USER }}

          key: ${{ secrets.VM_SSH_KEY }}

          port: ${{ secrets.VM_PORT }}


          envs: IMAGE_TAG,BACKEND_IMAGE,FRONTEND_IMAGE


          script: |

            set -euo pipefail


            echo "Starting deployment"

            echo "Image tag:"
            echo "$IMAGE_TAG"


            cd "${{ secrets.VM_DEPLOY_PATH }}"



            echo "Logging into GHCR"

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin



            echo "Pulling latest images"

            export IMAGE_TAG
            export BACKEND_IMAGE
            export FRONTEND_IMAGE


            docker compose pull



            echo "Restarting services"

            docker compose up -d --remove-orphans



            echo "Cleaning unused images"

            docker image prune -f



            docker logout ghcr.io


            echo "Deployment completed successfully"
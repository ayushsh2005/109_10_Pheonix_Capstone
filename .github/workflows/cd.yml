name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to deploy (defaults to commit SHA)"
        required: false
        type: string


concurrency:
  group: cd-production
  cancel-in-progress: false


jobs:

  build-and-push:

    name: Build and push Docker images

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}


      - name: Generate image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.image_tag }}"

          if [ -z "$TAG" ]; then
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Using image tag: $TAG"



      - name: Normalize GHCR image names
        id: images
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"

          BACKEND="ghcr.io/${OWNER_LC}/portfolio-backend"
          FRONTEND="ghcr.io/${OWNER_LC}/portfolio-frontend"

          echo "backend_image=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND" >> "$GITHUB_OUTPUT"

          echo "Backend: $BACKEND"
          echo "Frontend: $FRONTEND"



      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build and push backend image
        uses: docker/build-push-action@v6

        with:
          context: ./backend
          push: true

          tags: |
            ${{ steps.images.outputs.backend_image }}:${{ steps.tag.outputs.image_tag }}
            ${{ steps.images.outputs.backend_image }}:latest

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend



      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          push: true

          tags: |
            ${{ steps.images.outputs.frontend_image }}:${{ steps.tag.outputs.image_tag }}
            ${{ steps.images.outputs.frontend_image }}:latest

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend




  deploy:

    name: Deploy to VM

    needs:
      - build-and-push

    runs-on: ubuntu-latest


    environment:
      name: production



    steps:

      - name: Deploy over SSH

        uses: appleboy/ssh-action@v1.2.0


        env:

          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}

          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}



        with:

          host: ${{ secrets.VM_HOST }}

          username: ${{ secrets.VM_USER }}

          key: ${{ secrets.VM_SSH_KEY }}

          port: ${{ secrets.VM_PORT }}


          envs: IMAGE_TAG,BACKEND_IMAGE,FRONTEND_IMAGE


          script: |

            set -euo pipefail


            echo "Deploying:"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "BACKEND_IMAGE=$BACKEND_IMAGE"
            echo "FRONTEND_IMAGE=$FRONTEND_IMAGE"



            cd "${{ secrets.VM_DEPLOY_PATH }}"



            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin



            export IMAGE_TAG
            export BACKEND_IMAGE
            export FRONTEND_IMAGE



            docker compose pull


            docker compose up -d --remove-orphans



            docker image prune -f



            docker logout ghcr.io



            echo "Deployment completed successfully"
name: CD (Disabled - Jenkins Handles Production Deploy)

on:
  workflow_dispatch:

concurrency:
  group: cd-disabled
  cancel-in-progress: true

jobs:
  disabled:
    name: Deployment disabled in GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment policy
        run: |
          echo "GitHub Actions CD is intentionally disabled for this repository."
          echo "Production deployment is executed by Jenkins running on the VM."
          echo "Reason: inbound SSH to the VM is restricted, so remote SSH deployment is not used."
          echo "Use Jenkins job configured with ghcr-creds to deploy."
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Detect which parts of the monorepo changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ──────────────────────────────────────────────
  # Backend — Spring Boot / Maven
  # ──────────────────────────────────────────────
  backend:
    name: Backend (build & test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Generated fresh for this job run only — never stored, never logged.
      # Falls back to a repo/org secret (CI_DB_PASSWORD) if you'd rather pin one,
      # but a random per-run password means there's nothing meaningful to leak.
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MYSQL_DATABASE: portfolio_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Wait for MySQL
        env:
          MYSQL_PWD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            echo "waiting for mysql..."
            sleep 2
          done

      - name: Load schema
        env:
          MYSQL_PWD: ${{ secrets.CI_DB_PASSWORD }}
        # Load schema only — tests manage their own data via @Transactional
        run: |
          mysql -h127.0.0.1 -P3306 -uroot portfolio_db < src/main/resources/schema.sql

      - name: Build & run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/portfolio_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          # Schema is already loaded above from the real schema.sql — tell
          # Hibernate to just check it matches the entities, not manage it.
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload build artifact (jar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Frontend — Vite / React
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (lint & build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (mock data mode)
        env:
          VITE_USE_MOCK: 'true'
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Final gate — required status check for branch protection
  # ──────────────────────────────────────────────
  ci-success:
    name: CI Success
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          backend_result="${{ needs.backend.result }}"
          frontend_result="${{ needs.frontend.result }}"
          echo "backend: $backend_result"
          echo "frontend: $frontend_result"
          if [ "$backend_result" = "failure" ] || [ "$frontend_result" = "failure" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "CI passed (or job(s) skipped due to no relevant changes)."
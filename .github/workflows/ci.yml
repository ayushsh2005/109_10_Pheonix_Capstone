name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Detect which parts of the monorepo changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ──────────────────────────────────────────────
  # Backend — Spring Boot / Maven
  # ──────────────────────────────────────────────
  backend:
    name: Backend (build & test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build & run tests
        env:
          # Force backend tests onto isolated H2 config from
          # src/test/resources/application-test.properties.
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload build artifact (jar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Frontend — Vite / React
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (lint & build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (mock data mode)
        env:
          VITE_USE_MOCK: 'true'
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Final gate — required status check for branch protection
  # ──────────────────────────────────────────────
  ci-success:
    name: CI Success
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          backend_result="${{ needs.backend.result }}"
          frontend_result="${{ needs.frontend.result }}"
          echo "backend: $backend_result"
          echo "frontend: $frontend_result"
          if [ "$backend_result" = "failure" ] || [ "$frontend_result" = "failure" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "CI passed (or job(s) skipped due to no relevant changes)."
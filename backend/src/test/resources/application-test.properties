spring.application.name=backend-test
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=optional:classpath:data-test.sql

logging.level.org.springframework.test.context=DEBUG
logging.level.org.springframework.boot.test=DEBUG

app.cors.allowed-origin-patterns=*